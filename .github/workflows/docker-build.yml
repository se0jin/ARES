# ─────────────────────────────────────────────────────────────────────
# .github/workflows/docker-build.yml
# 스마트팜 CO2 예측 API — CI/CD 파이프라인 (08강)
# ─────────────────────────────────────────────────────────────────────
# 동작: main 브랜치 push → Docker 빌드 → DockerHub push → Render 자동 배포
#
# GitHub Secrets 등록 필요 (Settings → Secrets and variables → Actions):
#   DOCKER_USERNAME    : DockerHub 아이디
#   DOCKER_PASSWORD    : DockerHub Access Token (Read/Write)
#   RENDER_DEPLOY_HOOK : Render.com Deploy Hook URL
# ─────────────────────────────────────────────────────────────────────

name: SmartFarm CO2 API — Build & Deploy

on:
  push:
    branches:
      - main          # main 브랜치 push 시 자동 실행
  workflow_dispatch:  # GitHub Actions 탭에서 수동 실행 가능

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Render
    runs-on: ubuntu-latest   # GitHub 제공 가상 환경

    steps:
      # ── Step 1: 소스코드 체크아웃 ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Docker Buildx 설정 (멀티 플랫폼 + 캐시) ────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Step 3: DockerHub 로그인 ────────────────────────────────────
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Step 4: Docker 이미지 빌드 & DockerHub 푸시 ─────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: mlops
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smartfarm-co2-api:latest
            ${{ secrets.DOCKER_USERNAME }}/smartfarm-co2-api:${{ github.sha }}
          # 레이어 캐시 재사용 → 빌드 속도 향상
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartfarm-co2-api:buildcache
          cache-to:   type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartfarm-co2-api:buildcache,mode=max

      # ── Step 5: Render.com 자동 배포 트리거 ────────────────────────
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
          echo "Render 배포 요청 완료"

      # ── Step 6: 배포 결과 요약 출력 ────────────────────────────────
      - name: Deployment summary
        run: |
          echo "======================================"
          echo " 배포 완료 요약"
          echo "======================================"
          echo " 이미지: ${{ secrets.DOCKER_USERNAME }}/smartfarm-co2-api:latest"
          echo " 커밋:   ${{ github.sha }}"
          echo " 브랜치: ${{ github.ref_name }}"
          echo " 시각:   $(date '+%Y-%m-%d %H:%M:%S')"
          echo "======================================"
